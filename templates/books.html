{% extends 'base.html' %}

{% block title %}Books Management{% endblock %}
{% block page_title %}Books Management{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/books.css') }}">
{% endblock %}

{% block content %}
<div class="module-container">
    <div id="buttons_container" class="buttons_container">
        <!-- Left side -->
        <div class="button-group-left">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBookModal">Add Book (Ctrl + 1)</button>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#genreOverlayModal" onclick="loadGenres()">Add Genre (Ctrl + 2)</button>
        </div>

        
        <div class="search-wrapper">
            <div class="search-box">
                <span class="search-icon">🔍</span>

                <input type="text" id="searchTable" class="search-input" placeholder="Search books...">

                <button id="clearSearchInput" class="clear-btn">X</button>
            </div>
        </div>

        <!-- Right side -->
        <div class="button-group-right">
            <button id="exportExcelBtn" class="btn btn-success btn-sm">
                <i class="bi bi-file-earmark-excel"></i> Export to Excel
            </button>
            <button id="refreshTable" type="button" class="btn btn-outline-primary">Refresh Table</button>
        </div>
    </div>
    <!-- Genre Overlay Modal -->
    <div class="modal fade" id="genreOverlayModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content p-3">
                <!-- Search bar -->
                <div class="mb-3">
                    <input type="text" id="genreSearch" class="form-control" placeholder="Search or add genre...">
                </div>

                <!-- Genre Table -->
                <table class="table" id="genreTable">
                    <thead>
                        <tr>
                            <th>Genre</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Fantasy</td>
                            <td>
                                <button class="btn btn-sm btn-warning">Edit</button>
                                <button class="btn btn-sm btn-danger">Delete</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Science Fiction</td>
                            <td>
                                <button class="btn btn-sm btn-warning">Edit</button>
                                <button class="btn btn-sm btn-danger">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- Add button (dynamic) -->
                <div class="text-end">
                    <button class="btn btn-success" id="addGenreBtn" disabled>Add Genre</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Book Modal -->
<div class="modal fade" id="addBookModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Book</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <form id="addBookForm">

                    <div class="d-flex align-items-center mb-3">

                        <!-- Batch Mode (left) -->
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="batchMode">
                            <label class="form-check-label" for="batchMode">Batch Mode</label>
                        </div>

                        <!-- Reset (right) -->
                        <button type="button" class="btn btn-outline-secondary ms-auto" id="resetFormBtn">
                            Reset Form
                        </button>

                    </div>

                    <!-- Row 1 -->
                    <div class="row mb-3">

                        <div class="col-md-3">
                            <label class="form-label">ISBN</label>
                            <input type="text" class="form-control" id="isbn">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="title">
                        </div>

                    </div>

                    <!-- Row 2 -->
                    <div class="row mb-3">

                        <div class="col-md-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label">Author</label>

                                <label class="d-flex align-items-center gap-1 pin-label">
                                    <input type="checkbox" id="pinAuthor">
                                    Pin
                                </label>
                            </div>
                            <input type="text" class="form-control" id="author" list="authorList">
                            <datalist id="authorList"></datalist>
                        </div>

                        <div class="col-md-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label">Illustrator</label>

                                <label class="d-flex align-items-center gap-1 pin-label">
                                    <input type="checkbox" id="pinIllustrator">
                                    Pin
                                </label>
                            </div>
                            <input type="text" class="form-control" id="illustrator" list="illustratorList">
                            <datalist id="illustratorList"></datalist>
                        </div>

                        <div class="col-md-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label">Publisher</label>

                                <label class="d-flex align-items-center gap-1 pin-label">
                                    <input type="checkbox" id="pinPublisher">
                                    Pin
                                </label>
                            </div>
                            <input type="text" class="form-control" id="publisher" list="publisherList">
                            <datalist id="publisherList"></datalist>
                        </div>

                        <div class="col-md-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label">Publication Year</label>

                                <label class="d-flex align-items-center gap-1 pin-label">
                                    <input type="checkbox" id="pinYear">
                                    Pin
                                </label>
                            </div>
                            <select id="publicationYear" class="form-select"></select>
                        </div>

                    </div>

                    <!-- Row 3 -->
                    <div class="row mb-3">

                        <div class="col-md-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label">Category</label>

                                <label class="d-flex align-items-center gap-1 pin-label">
                                    <input type="checkbox" id="pinCategory">
                                    Pin
                                </label>
                            </div>
                            <select class="form-select" id="categoryId"></select>
                        </div>

                        <div class="col-md-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label">Total Copies</label>

                                <label class="d-flex align-items-center gap-1 pin-label">
                                    <input type="checkbox" id="pinCopies">
                                    Pin
                                </label>
                            </div>
                            <input type="number" class="form-control" id="totalCopies">
                        </div>

                        <div class="col-md-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label">Shelf Location</label>

                                <label class="d-flex align-items-center gap-1 pin-label">
                                    <input type="checkbox" id="pinShelf">
                                    Pin
                                </label>
                            </div>
                            <input type="text" class="form-control" id="shelfLocation">
                        </div>

                    </div>
        
                    <!-- Row 4 -->
                    <div class="row">

                        <div class="col-md-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label">Key Stage</label>

                                <label class="d-flex align-items-center gap-1 pin-label">
                                    <input type="checkbox" id="pinKeyStage">
                                    Pin
                                </label>
                            </div>
                            <select class="form-select" id="keyStage">
                                <option value="Kinder to Grade 1">Kinder to Grade 1</option>
                                <option value="KS 1 - Kinder to Grade 3">KS 1 - Kinder to Grade 3</option>
                                <option value="KS 1 & 2 - Kinder to Grade 6">KS 1 & 2 - Kinder to Grade 6</option>
                                <option value="KS 2 - Grade 4 to 6">KS 2 - Grade 4 to 6</option>
                                <option value="KS 2 & 3 - Grade 4 to 10">KS 2 & 3 - Grade 4 to 10</option>
                                <option value="KS 3 - Grade 7 to 10">KS 3 - Grade 7 to 10</option>
                                <option value="KS 3 & 4 - Grade 7 to 12">KS 3 & 4 - Grade 7 to 12</option>
                                <option value="KS 4 - Grade 11 to 12">KS 4 - Grade 11 to 12</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label">No. of Pages</label>

                                <label class="d-flex align-items-center gap-1 pin-label">
                                    <input type="checkbox" id="pinPages">
                                    Pin
                                </label>
                            </div>
                            <input type="number" class="form-control" id="noOfPages">
                        </div>

                    </div>

                </form>
            </div>


            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveBookBtn">Save Book</button>
            </div>
        </div>
    </div>
</div>
    <div id="booksTable"></div>
</div>
{% endblock %}

{% block extra_scripts %}

    <script src="{{ url_for('static', filename='js/exportExcelBooks.js') }}"></script>
    <script src="{{ url_for('static', filename='js/genreCRUD.js') }}"></script>
    <script src="{{ url_for('static', filename='js/searchBar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/saveBookForm.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bookFormProps.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            await loadGenres();
            loadBooks();

        });
        
        //overwritten in the seachbar.js, but keeping this here for reference
        /*async function loadBooks() {
            try {
                const res = await fetch('/api/books');
                const result = await res.json();

                if (result.error) {
                    console.error(result.error);
                    return;
                }

                hot.loadData(result.data); // 🔥 THIS replaces your dummy data

            } catch (err) {
                console.error(err);
            }
        }*/
        // FOR THE BOOKS TABLE
        const container = document.getElementById('booksTable');

        // empty data initalize
        const data = [
        ];

        const hot = new Handsontable(container, {
        //data: data,

        colHeaders: [
            "Book ID",
            "Accession # Start",
            "Accession # End",
            "Title",
            "Author",
            "ISBN",
            "Illustrator",
            "Publisher",
            "Year",
            "Genre",
            "Total",
            "Available",
            "Shelf",
            "Created",
            "Updated",
            "Grade Level",
            "Pages"
        ],

        columns: [
            { data: 'book_id', readOnly: true },
            { data: 'accession_no_start', readOnly: true},
            { data: 'accession_no_end', readOnly: true},
            { data: 'title' },
            //{ data: 'author' },
            //{ data: 'illustrator' },
            //{ data: 'publisher' },
            {
                data: 'author',
                type: 'autocomplete',
                source: function (query, process) {
                const values = originalData.map(r => r.author).filter(Boolean);
                process([...new Set(values)]);
                }
            },
            { data: 'isbn' },
            {
                data: 'illustrator',
                type: 'autocomplete',
                source: function (query, process) {
                const values = originalData.map(r => r.illustrator).filter(Boolean);
                process([...new Set(values)]);
                }
            },
            {
                data: 'publisher',
                type: 'autocomplete',
                source: function (query, process) {
                const values = originalData.map(r => r.publisher).filter(Boolean);
                process([...new Set(values)]);
                }
            },
            { data: 'publication_year', type: 'numeric' },
            {
                data: 'category_id',
                type: 'dropdown',
                source: [],
                renderer: function (instance, td, row, col, prop, value) {
                    // 👇 run the base renderer first — handles selection, highlighting, etc.
                    Handsontable.renderers.BaseRenderer.apply(this, arguments);
                    
                    const name = window.genreMap?.[Number(value)] || null;
                    if (value && !name) {
                        td.innerText = `Unknown (ID: ${value})`;
                        td.style.color = 'red';
                    } else {
                        td.innerText = name || '';
                        td.style.color = '';
                    }
                    return td;
                }
            },
            //{ data: 'category_id', type: 'numeric'},
            { data: 'total_copies', type: 'numeric'},
            { data: 'available_copies', type: 'numeric', readOnly: true },
            { data: 'shelf_location' },
            { data: 'created_at', type: 'date', dateFormat: 'YYYY-MM-DD' , readOnly: true},
            { data: 'last_updated_at', type: 'date', dateFormat: 'YYYY-MM-DD' , readOnly: true},
            //{ data: 'key_stage_grade_level' },
            {
                data: 'key_stage_grade_level',
                type: 'dropdown',
                source: [
                    "Kinder to Grade 1",
                    "KS 1 - Kinder to Grade 3",
                    "KS 1 & 2 - Kinder to Grade 6",
                    "KS 2 - Grade 4 to 6",
                    "KS 2 & 3 - Grade 4 to 10",
                    "KS 3 - Grade 7 to 10",
                    "KS 3 & 4 - Grade 7 to 12",
                    "KS 4 - Grade 11 to 12"
                ],
                strict: true,
                allowInvalid: false
            },
            { data: 'no_of_pages', type: 'numeric' }
        ],
        afterChange: function (changes, source) {
            if (!changes || source === 'loadData' || source === 'internal') return;

            changes.forEach(([row, prop, oldVal, newVal]) => {
                if (oldVal === newVal) return;

                let valueToSave = newVal;

                // auto capitalize
                const capitalizeFields = ['title', 'author', 'illustrator', 'publisher', 'shelf_location'];
                if (capitalizeFields.includes(prop) && typeof newVal === 'string') {
                    const capitalized = newVal.replace(/\b\w/g, c => c.toUpperCase());
                    if (capitalized !== newVal) {
                        hot.setDataAtRowProp(row, prop, capitalized, 'internal');
                        valueToSave = capitalized;
                    }
                }

                if (prop === 'category_id' && window.genreReverseMap?.[newVal]) {
                    valueToSave = window.genreReverseMap[newVal];
                    console.log('newVal:', newVal, 'valueToSave:', valueToSave); // 👈 inside forEach
                    // 👇 add this line here
                    hot.setDataAtRowProp(row, 'category_id', valueToSave, 'internal');
                    //hot.getSourceData()[row][prop] = valueToSave;
                    //hot.render();

                }

                let bookId = hot.getDataAtRowProp(row, 'book_id');

                if (!bookId) {
                    fetch('/api/books', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            title: hot.getDataAtRowProp(row, 'title') || "",
                            author: hot.getDataAtRowProp(row, 'author') || ""
                        })
                    })
                        .then(r => r.json())
                        .then(result => {
                            if (result.error) { 
                                console.error(result.error);
                                alert('Failed to create book: ' + result.error);
                                return;} //runs twice for some reason lol
                            hot.setDataAtRowProp(row, 'book_id', result.book_id, 'internal');
                            // 👇 set created_at and last_updated_at on new row
                            const today = new Date().toISOString().split('T')[0];
                            hot.setDataAtRowProp(row, 'created_at', today, 'internal');
                            hot.setDataAtRowProp(row, 'last_updated_at', today, 'internal');
                            return saveField(result.book_id, prop, valueToSave);
                        })
                        .then(() => {
                            // 👇 slight delay prevents visual overwrite bug
                            setTimeout(() => {
                                refreshTable();
                            }, 100);
                        })
                        .catch(console.error);
                } else {
                    // reload table after editing the total copies to update the accession number
                    saveField(bookId, prop, valueToSave).then(() => {
                        if (prop === 'total_copies') {
                            refreshTable(); // 👈 reuse your existing reload
                        }
                    });
                }
            });
        },

        contextMenu: {
            items: {
                'copy': {},
                'cut': {},
                'separator1': Handsontable.plugins.ContextMenu.SEPARATOR,
                'delete_row_custom': {
                    name: 'Remove row',
                    callback: function(key, selection) {
                        const row = selection[0].start.row;
                        const bookId = hot.getDataAtRowProp(row, 'book_id');

                        if (!bookId) {
                            hot.alter('remove_row', row);
                            return;
                        }

                        if (!confirm(`Delete book ID ${bookId}? This cannot be undone.`)) return;

                        fetch(`/api/books/${bookId}`, { method: 'DELETE' })
                            .then(r => r.json())
                            .then(result => {
                                if (result.error) {
                                    alert('Failed to delete: ' + result.error);
                                    return;
                                }
                                hot.alter('remove_row', row);
                            })
                            .catch(err => {
                                console.error(err);
                                alert('Something went wrong.');
                            });
                    }
                }
            }
        },

        //allow only digits for certain columns 
        beforeKeyDown: function(e) {
            const selected = this.getSelectedLast();
            if (!selected) return;

            // 👇 allow all ctrl/cmd shortcuts through (copy, paste, select all, undo etc.)
            if (e.ctrlKey || e.metaKey) return;

            const col = selected[1];
            const numericCols = [1, 2, 5, 8, 10, 11, 16]; // accession_start, accession_end, isbn, year, total, available, pages

            if (numericCols.includes(col)) {
                const allowed = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'];
                if (!allowed.includes(e.key) && !/^\d$/.test(e.key)) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            }
        },

        // 🔥 Excel-like features
        rowHeaders: true,

        // Editing
        licenseKey: 'non-commercial-and-evaluation',
        //contextMenu: true, // overwritten above 
        manualColumnResize: true,
        manualRowResize: false,

        // Sorting + filtering
        columnSorting: true,
        filters: true,
        dropdownMenu: true,

        // Navigation
        stretchH: 'all',
        width: '100%',
        height: '100%',
        hiddenColumns: {
          columns: [13,14], // indexes of columns you want hidden
          indicators: true   // optional: hides little UI markers
        },
        copyPaste: {
            rowsLimit: 10000,
            columnsLimit: 100,
        },

        // Auto new row
        minSpareRows: 1

        });

        function saveField(bookId, prop, value) {
            if (prop === 'book_id') return;
            return fetch(`/api/books/${bookId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ field: prop, value: value })
            })
            .then(r => r.json())
            .then(result => {
                if (result.error) { 
                    console.error(result.error);
                    alert('Failed to save: ' + result.error);
                    return; 
                }
                // 👇 update last_updated_at in the table
                const today = new Date().toISOString().split('T')[0];
                const rowIndex = hot.getSourceData().findIndex(r => String(r.book_id) === String(bookId));
                if (rowIndex !== -1) {
                    hot.setDataAtRowProp(rowIndex, 'last_updated_at', today, 'internal');
                }
            })
            .catch(console.error);
        }

        // FOR THE GENRE;
        const genreModal = document.getElementById('genreOverlayModal');
        const searchInput = document.getElementById('genreSearch');
        const addBtn = document.getElementById('addGenreBtn');
        const tableBody = document.querySelector('#genreTable tbody');

        let selectedIndex = -1;

        // Auto-focus search when modal opens
        genreModal.addEventListener('shown.bs.modal', () => {
            searchInput.focus();

            setTimeout(() => {
                selectRow(0);
            }, 50);
        });

        // Enable Add button if search input has text
        searchInput.addEventListener('input', () => {
            addBtn.disabled = searchInput.value.trim() === '';
        });

        // Select row helper
        function selectRow(index) {
            const rows = tableBody.querySelectorAll('tr');

            if (rows.length === 0) {
                selectedIndex = -1;
                return;
            }

            if (index < 0) index = 0;
            if (index >= rows.length) index = rows.length - 1;

            rows.forEach(row => row.classList.remove('selected'));

            selectedIndex = index;

            const selectedRow = rows[selectedIndex];
            if (!selectedRow) return;

            selectedRow.classList.add('selected');
            selectedRow.scrollIntoView({ block: 'nearest' });
        }

        function capitalizeWords(str) {
            return str
                // remove slash + backslash
                .replace(/[\\/]/g, '')

                // optional: remove other problematic symbols
                .replace(/[<>:"|?*]/g, '')

                .toLowerCase()
                .trim()
                .split(/\s+/)
                .filter(Boolean)
                .map(word => word[0].toUpperCase() + word.slice(1))
                .join(' ');
        }
        
        // KEYBOARD SHORTCUTS
        function openAddBookModal() {
            const modal = new bootstrap.Modal(document.getElementById('addBookModal'));
            modal.show();
        }

        function openAddGenreModal() {
            loadGenres(); // 👈 keep your existing logic
            const modal = new bootstrap.Modal(document.getElementById('genreOverlayModal'));
            modal.show();
        }

        document.addEventListener('keydown', function (e) {
            const tag = document.activeElement.tagName;

            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (e.ctrlKey && e.key === '1') {
                e.preventDefault();
                openAddBookModal();
            }

            if (e.ctrlKey && e.key === '2') {
                e.preventDefault();
                openAddGenreModal();
            }
        });
        
        document.getElementById('clearSearchInput').addEventListener('click', function() {
            const searchInput = document.getElementById('searchTable');
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input')); // trigger the input event to refresh the table
        });

        document.getElementById('refreshTable').addEventListener('click', refreshTable);

        function refreshTable() {
            loadGenres(); // ensure genres are fresh for the renderer
            loadCategoryDropdown(); // refresh dropdown options in case genres changed
            loadBooks();
            loadBookFieldDatalists(); // refresh datalists for author, illustrator, publisher  
            console.log('Table and Genres refreshed');
        }

        // Reset form function
        document.getElementById('resetFormBtn').addEventListener('click', resetForm);
        function resetForm() {

            // 1. turn off batch mode
            const batchMode = document.getElementById('batchMode');
            if (batchMode) batchMode.checked = false;

            // 2. clear all inputs (text + number + select)
            document.querySelectorAll('#addBookForm input, #addBookForm select').forEach(el => {

                if (el.type === 'checkbox') {
                    el.checked = false; // also clears all pin checkboxes
                } else {
                    el.value = "";
                }

            });
            document.getElementById("keyStage").selectedIndex = 0;

            console.log("Form reset completed.");
        }

        document.getElementById("addBookForm").addEventListener("keydown", function (e) {

            // trigger only on Enter (not Shift+Enter, etc.)
            if (e.key === "Enter") {

                // prevent accidental form submit / page reload
                e.preventDefault();

                // optional: ignore Enter on textarea if you add one later
                if (e.target.tagName === "TEXTAREA") return;

                // trigger Save button
                document.getElementById("saveBookBtn").click();
            }

        });

    </script>
{% endblock %}
