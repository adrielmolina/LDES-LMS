{% block extra_scripts %}
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            loadGenres();
        });

        // FOR THE BOOKS TABLE
        const container = document.getElementById('booksTable');

        const data = [
        {
            book_id: 1,
            accession_start: 1001,
            accession_end: 1005,
            isbn: "9781234567890",
            title: "Sample Book",
            author: "John Doe",
            illustrator: "Jane Smith",
            publisher: "Sample Publisher",
            year: 2026,
            category_id: 2,
            total: 10,
            available: 8,
            shelf: "A1",
            created: "2026-03-18",
            updated: "2026-03-18",
            grade: "KS 1 - Kinder to Grade 3",
            pages: 120
        }
        ];

        const hot = new Handsontable(container, {
        data: data,

        colHeaders: [
            "Book ID",
            "Accession Start",
            "Accession End",
            "ISBN",
            "Title",
            "Author",
            "Illustrator",
            "Publisher",
            "Year",
            "Category",
            "Total",
            "Available",
            "Shelf",
            "Created",
            "Updated",
            "Grade Level",
            "Pages"
        ],

        columns: [
            { data: 'book_id', readOnly: true },
            { data: 'accession_start', type: 'numeric' },
            { data: 'accession_end', type: 'numeric' },
            { data: 'isbn' },
            { data: 'title' },
            { data: 'author' },
            { data: 'illustrator' },
            { data: 'publisher' },
            { data: 'year', type: 'numeric' },
            { data: 'category_id', type: 'numeric' },
            { data: 'total', type: 'numeric' },
            { data: 'available', type: 'numeric' },
            { data: 'shelf' },
            { data: 'created', type: 'date', dateFormat: 'YYYY-MM-DD' },
            { data: 'updated', type: 'date', dateFormat: 'YYYY-MM-DD' },
            { data: 'grade' },
            { data: 'pages', type: 'numeric' }
        ],

        // 🔥 Excel-like features
        rowHeaders: true,

        // Editing
        licenseKey: 'non-commercial-and-evaluation',
        contextMenu: true, // right-click menu
        manualColumnResize: true,
        manualRowResize: true,

        // Sorting + filtering
        columnSorting: true,
        filters: true,
        dropdownMenu: true,

        // Navigation
        stretchH: 'all',
        width: '100%',
        height: 500,

        // Auto new row
        minSpareRows: 1
        });

        async function loadGenres() {
            const tbody = document.querySelector('#genreTable tbody');

            // 👇 show loading state immediately
            tbody.innerHTML = "<tr><td colspan='2'>Loading...</td></tr>";

            try {
                const res = await fetch('/api/categories');
                const result = await res.json();

                // 👇 clear loading
                tbody.innerHTML = "";

                result.data.forEach(genre => {
                    const row = document.createElement('tr');

                    row.innerHTML = `
                        <td>${genre.name}</td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="editGenre(${genre.category_id})">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteGenre(${genre.category_id})">Delete</button>
                        </td>
                    `;

                    tbody.appendChild(row);
                });

            } catch (err) {
                console.error(err);

                // 👇 show error state
                tbody.innerHTML = "<tr><td colspan='2'>Failed to load</td></tr>";
            }
        }

        // FOR THE GENRE);

        const genreModal = document.getElementById('genreOverlayModal');
        const searchInput = document.getElementById('genreSearch');
        const addBtn = document.getElementById('addGenreBtn');
        const tableBody = document.querySelector('#genreTable tbody');

        let selectedIndex = -1;

        // Auto-focus search when modal opens
        genreModal.addEventListener('shown.bs.modal', () => {
            searchInput.focus();

            // ✅ force selection AFTER modal fully renders
            setTimeout(() => {
                selectRow(0);
            }, 50);
        });

        // Enable Add button if search input has text
        searchInput.addEventListener('input', () => {
        addBtn.disabled = searchInput.value.trim() === '';
        });

        // 🔹 Select row helper
        function selectRow(index) {
            const rows = tableBody.querySelectorAll('tr');

            if (rows.length === 0) {
                selectedIndex = -1;
                return;
            }

            // clamp index
            if (index < 0) index = 0;
            if (index >= rows.length) index = rows.length - 1;

            // remove previous selection
            rows.forEach(row => row.classList.remove('selected'));

            selectedIndex = index;

            const selectedRow = rows[selectedIndex];
            if (!selectedRow) return;

            selectedRow.classList.add('selected');

            // scroll into view
            selectedRow.scrollIntoView({ block: 'nearest' });
        }

        // 🔹 Add genre
        function addGenre() {
        const value = searchInput.value.trim();
        if (!value) return;

        // API placeholder
        console.log('API CALL: ADD', value);

        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${value}</td>
            <td>
            <button class="btn btn-sm btn-warning">Edit</button>
            <button class="btn btn-sm btn-danger">Delete</button>
            </td>`;
        tableBody.appendChild(row);

        searchInput.value = '';
        addBtn.disabled = true;

        selectRow(tableBody.children.length - 1);
        searchInput.focus();
        }

        // 🔹 Edit selected
        function editSelected() {
        const rows = tableBody.querySelectorAll('tr');
        if (selectedIndex < 0 || !rows[selectedIndex]) return;

        const cell = rows[selectedIndex].children[0];
        const current = cell.textContent;

        const updated = prompt('Edit genre:', current);
        if (updated && updated.trim() !== '') {
            cell.textContent = updated.trim();

            // API placeholder
            console.log('API CALL: EDIT', current, '→', updated);
        }
        }

        // 🔹 Delete selected
        function deleteSelected() {
        const rows = tableBody.querySelectorAll('tr');
        if (selectedIndex < 0 || !rows[selectedIndex]) return;

        const value = rows[selectedIndex].children[0].textContent;

        if (confirm(`Delete "${value}"?`)) {
            rows[selectedIndex].remove();

            // API placeholder
            console.log('API CALL: DELETE', value);

            selectRow(selectedIndex - 1);
        }
        }

        // 🔹 Button click
        addBtn.addEventListener('click', addGenre);

        // 🔹 Enter key = Add
        searchInput.addEventListener('keypress', e => {
        if (e.key === 'Enter') {
            e.preventDefault();
            addGenre();
        }
        });


        let keybinds = {
            up: 'ArrowUp',
            down: 'ArrowDown',
            edit: '<',
            delete: '>'
        };

        const genreModal1 = document.getElementById('genreOverlayModal');

        genreModal1.addEventListener('keydown', e => {
        const activeEl = document.activeElement;
        const isTyping = activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA';

        // ✅ ALWAYS handle UP/DOWN (even inside input)
        if (e.key === keybinds.up) {
            e.preventDefault();
            selectRow(selectedIndex - 1);
            return;
        }

        if (e.key === keybinds.down) {
            e.preventDefault();
            selectRow(selectedIndex + 1);
            return;
        }

        // ⛔ block other shortcuts while typing
        if (isTyping) return;

        // ✅ EDIT
        if (e.key === keybinds.edit) {
            e.preventDefault();
            editSelected();
        }

        // ✅ DELETE
        if (e.key === keybinds.delete) {
            e.preventDefault();
            deleteSelected();
        }
        });



    </script>
    
{% endblock %}
