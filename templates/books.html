{% extends 'base.html' %}

{% block title %}Books Management{% endblock %}
{% block page_title %}Books Management{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/books.css') }}">
{% endblock %}

{% block content %}
<div class="module-container">

    <div id="buttons_container" class="buttons_container">
        <div class="button-group-left">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBookModal">Add Book (Ctrl + 1)</button>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#genreOverlayModal" onclick="loadGenres()">Add Genre (Ctrl + 2)</button>
        </div>

        <div class="search-wrapper">
          <div class="search-box">
            <span class="search-icon">🔍</span>

            <input type="text" id="searchTable" class="search-input" placeholder="Search books...">

            <button id="clearSearchInput" class="clear-btn">X</button>
          </div>
        </div>
    </div>
    <!-- Genre Overlay Modal -->
    <div class="modal fade" id="genreOverlayModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content p-3">
                <!-- Search bar -->
                <div class="mb-3">
                    <input type="text" id="genreSearch" class="form-control" placeholder="Search or add genre...">
                </div>

                <!-- Genre Table -->
                <table class="table" id="genreTable">
                    <thead>
                        <tr>
                            <th>Genre</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Fantasy</td>
                            <td>
                                <button class="btn btn-sm btn-warning">Edit</button>
                                <button class="btn btn-sm btn-danger">Delete</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Science Fiction</td>
                            <td>
                                <button class="btn btn-sm btn-warning">Edit</button>
                                <button class="btn btn-sm btn-danger">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- Add button (dynamic) -->
                <div class="text-end">
                    <button class="btn btn-success" id="addGenreBtn" disabled>Add Genre</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Book Modal -->
<div class="modal fade" id="addBookModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Book</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addBookForm">
                    <!-- Row 1 -->
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label for="accessionStart" class="form-label">Accession Start</label>
                            <input type="text" class="form-control" id="accessionStart" placeholder="Enter Accession Start">
                        </div>
                        <div class="col-md-3">
                            <label for="accessionEnd" class="form-label">Accession End</label>
                            <input type="text" class="form-control" id="accessionEnd" placeholder="Enter Accession End">
                        </div>
                        <div class="col-md-3">
                            <label for="isbn" class="form-label">ISBN</label>
                            <input type="text" class="form-control" id="isbn" placeholder="Enter ISBN">
                        </div>
                        <div class="col-md-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" placeholder="Enter Book Title">
                        </div>
                    </div>

                    <!-- Row 2 -->
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label for="author" class="form-label">Author</label>
                            <input type="text" class="form-control" id="author" placeholder="Enter Author">
                        </div>
                        <div class="col-md-3">
                            <label for="illustrator" class="form-label">Illustrator</label>
                            <input type="text" class="form-control" id="illustrator" placeholder="Enter Illustrator">
                        </div>
                        <div class="col-md-3">
                            <label for="publisher" class="form-label">Publisher</label>
                            <input type="text" class="form-control" id="publisher" placeholder="Enter Publisher">
                        </div>
                        <div class="col-md-3">
                            <label for="publicationYear" class="form-label">Publication Year</label>
                            <input type="text" class="form-control" id="publicationYear" placeholder="Enter Publication Year">
                        </div>
                    </div>

                    <!-- Row 3 -->
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label for="categoryId" class="form-label">Category ID</label>
                            <input type="text" class="form-control" id="categoryId" placeholder="Enter Category ID">
                        </div>
                        <div class="col-md-3">
                            <label for="totalCopies" class="form-label">Total Copies</label>
                            <input type="number" class="form-control" id="totalCopies" placeholder="Total Copies">
                        </div>
                        <div class="col-md-3">
                            <label for="availableCopies" class="form-label">Available Copies</label>
                            <input type="number" class="form-control" id="availableCopies" placeholder="Available Copies">
                        </div>
                        <div class="col-md-3">
                            <label for="shelfLocation" class="form-label">Shelf Location</label>
                            <input type="text" class="form-control" id="shelfLocation" placeholder="Enter Shelf Location">
                        </div>
                    </div>

                    <!-- Row 4 -->
                    <div class="row">
                        <div class="col-md-3">
                            <label for="keyStage" class="form-label">Key Stage Grade Level</label>
                            <select class="form-select" id="keyStage">
                                <option value="">Select Key Stage</option>
                                <option value="KS 1 - Kinder to Grade 3">KS 1 - Kinder to Grade 3</option>
                                <option value="KS 2 - Grade 4 to Grade 6">KS 2 - Grade 4 to Grade 6</option>
                                <option value="KS 3 - Grade 7 to Grade 10">KS 3 - Grade 7 to Grade 10</option>
                                <option value="KS 4 - Grade 11 to Grade 12">KS 4 - Grade 11 to Grade 12</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="noOfPages" class="form-label">No. of Pages</label>
                            <input type="number" class="form-control" id="noOfPages" placeholder="Enter number of pages">
                        </div>
                        <div class="col-md-3">
                            <label for="createdAt" class="form-label">Created At</label>
                            <input type="date" class="form-control" id="createdAt">
                        </div>
                        <div class="col-md-3">
                            <label for="lastUpdated" class="form-label">Last Updated At</label>
                            <input type="date" class="form-control" id="lastUpdated">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveBookBtn">Save Book</button>
                <!-- TODO disable when empty -->
            </div>
        </div>
    </div>
</div>

    <div id="booksTable"></div>
</div>
{% endblock %}

{% block extra_scripts %}
    <script src="{{ url_for('static', filename='js/genreCRUD.js') }}"></script>
    <script src="{{ url_for('static', filename='js/searchBar.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            await loadGenres();
            loadBooks();

        });
        
        //overwritten in the seachbar.js, but keeping this here for reference
        /*async function loadBooks() {
            try {

                if (result.error) {

                    return;
                }

            } catch (err) {

            }
        }*/

        // FOR THE BOOKS TABLE
        const container = document.getElementById('booksTable');

        // empty data initalize
        const data = [
        ];

        const hot = new Handsontable(container, {
        //data: data,

        colHeaders: [
            "Book ID",
            "Accession # Start",
            "Accession # End",
            "ISBN",
            "Title",
            "Author",
            "Illustrator",
            "Publisher",
            "Year",
            "Category",
            "Total",
            "Available",
            "Shelf",
            "Created",
            "Updated",
            "Grade Level",
            "Pages"
        ],

        columns: [
            { data: 'book_id', readOnly: true },
            { data: 'accession_no_start', type: 'numeric' },
            { data: 'accession_no_end', type: 'numeric' },
            { data: 'isbn' },
            { data: 'title' },
            { data: 'author' },
            { data: 'illustrator' },
            { data: 'publisher' },
            { data: 'publication_year', type: 'numeric' },
            
            {
                data: 'category_id',
                type: 'dropdown',
                source: [],
                renderer: function (instance, td, row, col, prop, value) {
                    console.log('RENDERER value:', value, typeof value, 'genreMap:', JSON.stringify(window.genreMap));
                    const name = window.genreMap?.[Number(value)] || null;
                    if (!name && value) {
                        td.innerText = `Unknown (ID: ${value})`;
                        td.style.color = 'red';
                    } else {
                        td.innerText = name || '';
                        td.style.color = '';  // 👈 don't forget this reset
                    }
                    return td;
                }
            },
            //{ data: 'category_id', type: 'numeric'},
            { data: 'total_copies', type: 'numeric' },
            { data: 'available_copies', type: 'numeric' },
            { data: 'shelf_location' },
            { data: 'created_at', type: 'date', dateFormat: 'YYYY-MM-DD' , readOnly: true},
            { data: 'last_updated_at', type: 'date', dateFormat: 'YYYY-MM-DD' , readOnly: true},
            //{ data: 'key_stage_grade_level' },
            {
                data: 'key_stage_grade_level',
                type: 'dropdown',
                source: [
                    "KS 1 - Kinder to Grade 3",
                    "KS 1 & 2 - Kinder to Grade 6",
                    "KS 2 - Grade 4 to 6",
                    "KS 4 - Grade 11 to 12",
                    "KS 3 & 4 - Grade 7 to 12",
                    "KS 3 - Grade 7 to 10",
                    "Kinder to Grade 1",
                    "KS 2 & 3 - Grade 4 to 10",
                    "KS 1 - Kinder at Grade 3"
                ],
                strict: true,
                allowInvalid: false
            },
            { data: 'no_of_pages', type: 'numeric' }
        ],
        
        afterChange: function (changes, source) {
            
            if (!changes || source === 'loadData' || source === 'internal') return;

            changes.forEach(([row, prop, oldVal, newVal]) => {
                if (oldVal === newVal) return;

                let valueToSave = newVal;
                if (prop === 'category_id' && window.genreReverseMap?.[newVal]) {
                    valueToSave = window.genreReverseMap[newVal];
                    console.log('newVal:', newVal, 'valueToSave:', valueToSave); // 👈 inside forEach
                    // 👇 add this line here
                    hot.setDataAtRowProp(row, 'category_id', valueToSave, 'internal');
                    //hot.getSourceData()[row][prop] = valueToSave;
                    //hot.render();

                }

                let bookId = hot.getDataAtRowProp(row, 'book_id');

                if (!bookId) {
                    fetch('/api/books', { method: 'POST' })
                        .then(r => r.json())
                        .then(result => {
                            if (result.error) { console.error(result.error); return; }
                            hot.setDataAtRowProp(row, 'book_id', result.book_id, 'internal');
                            // 👇 set created_at and last_updated_at on new row
                            const today = new Date().toISOString().split('T')[0];
                            hot.setDataAtRowProp(row, 'created_at', today, 'internal');
                            hot.setDataAtRowProp(row, 'last_updated_at', today, 'internal');
                            return saveField(result.book_id, prop, valueToSave);
                        })
                        .catch(console.error);
                } else {
                    saveField(bookId, prop, valueToSave);
                }
            });
        },

        contextMenu: {
            items: {
                'copy': {},
                'cut': {},
                'separator1': Handsontable.plugins.ContextMenu.SEPARATOR,
                'delete_row_custom': {
                    name: 'Remove row',
                    callback: function(key, selection) {
                        const row = selection[0].start.row;
                        const bookId = hot.getDataAtRowProp(row, 'book_id');

                        if (!bookId) {
                            hot.alter('remove_row', row);
                            return;
                        }

                        if (!confirm(`Delete book ID ${bookId}? This cannot be undone.`)) return;

                        fetch(`/api/books/${bookId}`, { method: 'DELETE' })
                            .then(r => r.json())
                            .then(result => {
                                if (result.error) {
                                    alert('Failed to delete: ' + result.error);
                                    return;
                                }
                                hot.alter('remove_row', row);
                            })
                            .catch(err => {
                                console.error(err);
                                alert('Something went wrong.');
                            });
                    }
                }
            }
        },

        //allow only digits for certain columns 
        beforeKeyDown: function(e) {
            const selected = this.getSelectedLast();
            if (!selected) return;

            const col = selected[1];
            const numericCols = [1, 2, 3, 8, 10, 11, 16]; // accession_start, accession_end, isbn, year, total, available, pages

            if (numericCols.includes(col)) {
                const allowed = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'];
                if (!allowed.includes(e.key) && !/^\d$/.test(e.key)) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            }
        },

        // 🔥 Excel-like features
        rowHeaders: true,

        // Editing
        licenseKey: 'non-commercial-and-evaluation',
        //contextMenu: true, // overwritten above 
        manualColumnResize: true,
        manualRowResize: false,

        // Sorting + filtering
        columnSorting: true,
        filters: true,
        dropdownMenu: true,

        // Navigation
        stretchH: 'all',
        width: '100%',
        height: '100%',
        hiddenColumns: {
          columns: [0,13,14], // indexes of columns you want hidden
          indicators: false   // optional: hides little UI markers
        },


        // Auto new row
        minSpareRows: 1

        });

        function saveField(bookId, prop, value) {
            if (prop === 'book_id') return;
            return fetch(`/api/books/${bookId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ field: prop, value: value })
            })
            .then(r => r.json())
            .then(result => {
                if (result.error) { console.error(result.error); return; }
                // 👇 update last_updated_at in the table
                const today = new Date().toISOString().split('T')[0];
                const rowIndex = hot.getSourceData().findIndex(r => r.book_id === bookId);
                if (rowIndex !== -1) {
                    hot.setDataAtRowProp(rowIndex, 'last_updated_at', today, 'internal');
                }
            })
            .catch(console.error);
        }

        //TODO add filter for punctuations ex. slash and backslash, causes error on deletion
        // FOR THE GENRE;
        const genreModal = document.getElementById('genreOverlayModal');
        const searchInput = document.getElementById('genreSearch');
        const addBtn = document.getElementById('addGenreBtn');
        const tableBody = document.querySelector('#genreTable tbody');

        let selectedIndex = -1;

        // Auto-focus search when modal opens
        genreModal.addEventListener('shown.bs.modal', () => {
            searchInput.focus();

            setTimeout(() => {
                selectRow(0);
            }, 50);
        });

        // Enable Add button if search input has text
        searchInput.addEventListener('input', () => {
            addBtn.disabled = searchInput.value.trim() === '';
        });

        // Select row helper
        function selectRow(index) {
            const rows = tableBody.querySelectorAll('tr');

            if (rows.length === 0) {
                selectedIndex = -1;
                return;
            }

            if (index < 0) index = 0;
            if (index >= rows.length) index = rows.length - 1;

            rows.forEach(row => row.classList.remove('selected'));

            selectedIndex = index;

            const selectedRow = rows[selectedIndex];
            if (!selectedRow) return;

            selectedRow.classList.add('selected');
            selectedRow.scrollIntoView({ block: 'nearest' });
        }

        function capitalizeWords(str) {
            return str
                .toLowerCase()
                .trim()
                .split(/\s+/)
                .filter(Boolean)
                .map(word => word[0].toUpperCase() + word.slice(1))
                .join(' ');
        }
        
        // KEYBOARD SHORTCUTS
        function openAddBookModal() {
            const modal = new bootstrap.Modal(document.getElementById('addBookModal'));
            modal.show();
        }

        function openAddGenreModal() {
            loadGenres(); // 👈 keep your existing logic
            const modal = new bootstrap.Modal(document.getElementById('genreOverlayModal'));
            modal.show();
        }

        document.addEventListener('keydown', function (e) {
            const tag = document.activeElement.tagName;

            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (e.ctrlKey && e.key === '1') {
                e.preventDefault();
                openAddBookModal();
            }

            if (e.ctrlKey && e.key === '2') {
                e.preventDefault();
                openAddGenreModal();
            }
        });
        
        document.getElementById('clearSearchInput').addEventListener('click', function() {
            const searchInput = document.getElementById('searchTable');
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input')); // trigger the input event to refresh the table
        });

        <!-- TODO finish next week -->
        function collectBookFormData() {
            return {
                accession_start: document.getElementById('accessionStart').value.trim(),
                accession_end: document.getElementById('accessionEnd').value.trim(),
                isbn: document.getElementById('isbn').value.trim(),
                title: document.getElementById('title').value.trim(),

                author: document.getElementById('author').value.trim(),
                illustrator: document.getElementById('illustrator').value.trim(),
                publisher: document.getElementById('publisher').value.trim(),
                publication_year: document.getElementById('publicationYear').value.trim(),

                category_id: document.getElementById('categoryId').value.trim(),
                total_copies: document.getElementById('totalCopies').value,
                available_copies: document.getElementById('availableCopies').value,
                shelf_location: document.getElementById('shelfLocation').value.trim(),

                key_stage_grade_level: document.getElementById('keyStage').value,
                no_of_pages: document.getElementById('noOfPages').value,

                created_at: document.getElementById('createdAt').value,
                last_updated_at: document.getElementById('lastUpdated').value
            };
        }
        document.getElementById('saveBookBtn').addEventListener('click', () => {
            const bookData = collectBookFormData();

            console.log(bookData); // 👈 for now

            // later: send to API
        });

    </script>
{% endblock %}
