{% extends 'base.html' %}

{% block title %}Books Management{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/books.css') }}">
{% endblock %}

{% block content %}
<div class="module-container">
    <div class="module-header">
        <h1 class="title">Book Management</h1>
    </div>

    <div id="buttons_container" class="buttons_container">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBookModal" >Add Book (Ctrl + 1)</button>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#genreOverlayModal" onclick="loadGenres()">Add Genre (Ctrl + 2)</button>
    </div>
    <!-- Genre Overlay Modal -->
    <div class="modal fade" id="genreOverlayModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content p-3">
                <!-- Search bar -->
                <div class="mb-3">
                    <input type="text" id="genreSearch" class="form-control" placeholder="Search or add genre...">
                </div>

                <!-- Genre Table -->
                <table class="table" id="genreTable">
                    <thead>
                        <tr>
                            <th>Genre</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Fantasy</td>
                            <td>
                                <button class="btn btn-sm btn-warning">Edit</button>
                                <button class="btn btn-sm btn-danger">Delete</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Science Fiction</td>
                            <td>
                                <button class="btn btn-sm btn-warning">Edit</button>
                                <button class="btn btn-sm btn-danger">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- Add button (dynamic) -->
                <div class="text-end">
                    <button class="btn btn-success" id="addGenreBtn" disabled>Add Genre</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Book Modal -->
<div class="modal fade" id="addBookModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Book</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addBookForm">
                    <!-- Row 1 -->
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label for="accessionStart" class="form-label">Accession Start</label>
                            <input type="text" class="form-control" id="accessionStart" placeholder="Enter Accession Start">
                        </div>
                        <div class="col-md-3">
                            <label for="accessionEnd" class="form-label">Accession End</label>
                            <input type="text" class="form-control" id="accessionEnd" placeholder="Enter Accession End">
                        </div>
                        <div class="col-md-3">
                            <label for="isbn" class="form-label">ISBN</label>
                            <input type="text" class="form-control" id="isbn" placeholder="Enter ISBN">
                        </div>
                        <div class="col-md-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" placeholder="Enter Book Title">
                        </div>
                    </div>

                    <!-- Row 2 -->
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label for="author" class="form-label">Author</label>
                            <input type="text" class="form-control" id="author" placeholder="Enter Author">
                        </div>
                        <div class="col-md-3">
                            <label for="illustrator" class="form-label">Illustrator</label>
                            <input type="text" class="form-control" id="illustrator" placeholder="Enter Illustrator">
                        </div>
                        <div class="col-md-3">
                            <label for="publisher" class="form-label">Publisher</label>
                            <input type="text" class="form-control" id="publisher" placeholder="Enter Publisher">
                        </div>
                        <div class="col-md-3">
                            <label for="publicationYear" class="form-label">Publication Year</label>
                            <input type="text" class="form-control" id="publicationYear" placeholder="Enter Publication Year">
                        </div>
                    </div>

                    <!-- Row 3 -->
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label for="categoryId" class="form-label">Category ID</label>
                            <input type="text" class="form-control" id="categoryId" placeholder="Enter Category ID">
                        </div>
                        <div class="col-md-3">
                            <label for="totalCopies" class="form-label">Total Copies</label>
                            <input type="number" class="form-control" id="totalCopies" placeholder="Total Copies">
                        </div>
                        <div class="col-md-3">
                            <label for="availableCopies" class="form-label">Available Copies</label>
                            <input type="number" class="form-control" id="availableCopies" placeholder="Available Copies">
                        </div>
                        <div class="col-md-3">
                            <label for="shelfLocation" class="form-label">Shelf Location</label>
                            <input type="text" class="form-control" id="shelfLocation" placeholder="Enter Shelf Location">
                        </div>
                    </div>

                    <!-- Row 4 -->
                    <div class="row">
                        <div class="col-md-3">
                            <label for="keyStage" class="form-label">Key Stage Grade Level</label>
                            <select class="form-select" id="keyStage">
                                <option value="">Select Key Stage</option>
                                <option value="KS 1 - Kinder to Grade 3">KS 1 - Kinder to Grade 3</option>
                                <option value="KS 2 - Grade 4 to Grade 6">KS 2 - Grade 4 to Grade 6</option>
                                <option value="KS 3 - Grade 7 to Grade 10">KS 3 - Grade 7 to Grade 10</option>
                                <option value="KS 4 - Grade 11 to Grade 12">KS 4 - Grade 11 to Grade 12</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="noOfPages" class="form-label">No. of Pages</label>
                            <input type="number" class="form-control" id="noOfPages" placeholder="Enter number of pages">
                        </div>
                        <div class="col-md-3">
                            <label for="createdAt" class="form-label">Created At</label>
                            <input type="date" class="form-control" id="createdAt">
                        </div>
                        <div class="col-md-3">
                            <label for="lastUpdated" class="form-label">Last Updated At</label>
                            <input type="date" class="form-control" id="lastUpdated">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveBookBtn">Save Book</button>
            </div>
        </div>
    </div>
</div>

    <div id="booksTable"></div>
</div>
{% endblock %}

{% block extra_scripts %}
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            loadGenres();
        });

        // FOR THE BOOKS TABLE
        const container = document.getElementById('booksTable');

        const data = [
        {
            book_id: 1,
            accession_start: 1001,
            accession_end: 1005,
            isbn: "9781234567890",
            title: "Sample Book",
            author: "John Doe",
            illustrator: "Jane Smith",
            publisher: "Sample Publisher",
            year: 2026,
            category_id: 2,
            total: 10,
            available: 8,
            shelf: "A1",
            created: "2026-03-18",
            updated: "2026-03-18",
            grade: "KS 1 - Kinder to Grade 3",
            pages: 120
        }
        ];

        const hot = new Handsontable(container, {
        data: data,

        colHeaders: [
            "Book ID",
            "Accession Start",
            "Accession End",
            "ISBN",
            "Title",
            "Author",
            "Illustrator",
            "Publisher",
            "Year",
            "Category",
            "Total",
            "Available",
            "Shelf",
            "Created",
            "Updated",
            "Grade Level",
            "Pages"
        ],

        columns: [
            { data: 'book_id', readOnly: true },
            { data: 'accession_start', type: 'numeric' },
            { data: 'accession_end', type: 'numeric' },
            { data: 'isbn' },
            { data: 'title' },
            { data: 'author' },
            { data: 'illustrator' },
            { data: 'publisher' },
            { data: 'year', type: 'numeric' },
            /*
            {
                data: 'category_id',

                type: 'dropdown',
                source: function () {
                    return window.genres.map(g => g.name);
                },

                renderer: function (instance, td, row, col, prop, value) {
                    const name = window.genreMap[value] || '';
                    td.innerText = name;
                    return td;
                }
            },*/
            { data: 'category_id', type: 'numeric'},
            { data: 'total', type: 'numeric' },
            { data: 'available', type: 'numeric' },
            { data: 'shelf' },
            { data: 'created', type: 'date', dateFormat: 'YYYY-MM-DD' },
            { data: 'updated', type: 'date', dateFormat: 'YYYY-MM-DD' },
            { data: 'grade' },
            { data: 'pages', type: 'numeric' }
        ],

        // 🔥 Excel-like features
        rowHeaders: true,

        // Editing
        licenseKey: 'non-commercial-and-evaluation',
        contextMenu: true, // right-click menu
        manualColumnResize: true,
        manualRowResize: true,

        // Sorting + filtering
        columnSorting: true,
        filters: true,
        dropdownMenu: true,

        // Navigation
        stretchH: 'all',
        width: '100%',
        height: 500,

        // Auto new row
        minSpareRows: 1
        });

        //TODO add filter for punctuations ex. slash and backslash, causes error on deletion
        // FOR THE GENRE;
        const genreModal = document.getElementById('genreOverlayModal');
        const searchInput = document.getElementById('genreSearch');
        const addBtn = document.getElementById('addGenreBtn');
        const tableBody = document.querySelector('#genreTable tbody');

        let selectedIndex = -1;

        // Auto-focus search when modal opens
        genreModal.addEventListener('shown.bs.modal', () => {
            searchInput.focus();

            setTimeout(() => {
                selectRow(0);
            }, 50);
        });

        // Enable Add button if search input has text
        searchInput.addEventListener('input', () => {
            addBtn.disabled = searchInput.value.trim() === '';
        });

        // Select row helper
        function selectRow(index) {
            const rows = tableBody.querySelectorAll('tr');

            if (rows.length === 0) {
                selectedIndex = -1;
                return;
            }

            if (index < 0) index = 0;
            if (index >= rows.length) index = rows.length - 1;

            rows.forEach(row => row.classList.remove('selected'));

            selectedIndex = index;

            const selectedRow = rows[selectedIndex];
            if (!selectedRow) return;

            selectedRow.classList.add('selected');
            selectedRow.scrollIntoView({ block: 'nearest' });
        }

        function capitalizeWords(str) {
            return str
                .toLowerCase()
                .trim()
                .split(/\s+/)
                .filter(Boolean)
                .map(word => word[0].toUpperCase() + word.slice(1))
                .join(' ');
        }
        
        // KEYBOARD SHORTCUTS
        function openAddBookModal() {
            const modal = new bootstrap.Modal(document.getElementById('addBookModal'));
            modal.show();
        }

        function openAddGenreModal() {
            loadGenres(); // 👈 keep your existing logic
            const modal = new bootstrap.Modal(document.getElementById('genreOverlayModal'));
            modal.show();
        }

        document.addEventListener('keydown', function (e) {
            const tag = document.activeElement.tagName;

            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (e.ctrlKey && e.key === '1') {
                e.preventDefault();
                openAddBookModal();
            }

            if (e.ctrlKey && e.key === '2') {
                e.preventDefault();
                openAddGenreModal();
            }
        });
        

    </script>

    <script src="{{ url_for('static', filename='js/genreCRUD.js') }}"></script>
    
{% endblock %}
