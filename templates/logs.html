{% extends 'base.html' %}


{% block title %}Logs{% endblock %}
{% block page_title %}Audit Trail{% endblock %}


{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/logs.css') }}">
{% endblock %}


{% block content %}
<div class="module-container">
    
    <div class="d-flex justify-content-end mb-2">
        <button onclick="loadLogs()" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
    </div>

    <table id="logsTable" class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Log ID</th>
                <th>Time</th>
                <th>Action</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            
        </tbody>
    </table>
</div>
{% endblock %}


{% block extra_scripts %}
    <script>
        
        let logsTable = new DataTable('#logsTable', {
            order: [[1, 'desc']],
            pageLength: 50,
        });

        async function loadLogs() {
            try {
                const res = await fetch('/api/logs');
                const result = await res.json();
                if (result.error) {
                    console.error(result.error);
                    return;
                }
                logsTable.clear();
                result.data.forEach(row => {
                    logsTable.row.add([
                        row.log_id,
                        row.log_time,
                        row.action_name,
                        row.description
                    ]);
                });
                logsTable.draw();
            } catch (err) {
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadLogs);

    </script>
    

{% endblock %}
