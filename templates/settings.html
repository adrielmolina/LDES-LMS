{% extends 'base.html' %}

{% block title %}Settings{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/settings.css') }}">
{% endblock %}

{% block content %}
<div class="module-container">
    <div class="module-header">
        <h1 class="title">Settings</h1>
    </div>

    <div class="settings-form">
        <!-- THEME SECTION -->
        <div class="settings-section">
            <h2 class="section-header">Theme</h2>
            <div class="section-content">
                <div class="form-group">
                    <label>Theme Mode</label>
                    <select id="theme-select">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 2. FONT SETTINGS -->
        <div class="settings-section">
            <h2 class="section-header">Font Settings</h2>
            <div class="section-content">
                <div class="form-group">
                    <label>Font Style</label>
                    <select id="font-style-select">
                        <option value="sans-serif">Sans-serif</option>
                        <option value="serif">Serif</option>
                        <option value="monospace">Monospace</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Font Size</label>
                    <select id="font-size-select">
                        <option value="small">Small</option>
                        <option value="medium" selected>Medium</option>
                        <option value="large">Large</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 3. KEYBINDS -->
        <div class="settings-section">
            <h2 class="section-header">Keybind & Controls</h2>
            <div class="section-content">
                <div class="form-group">
                    <label>Custom Control Map</label>
                    <button class="btn">Edit Keybinds</button>
                </div>
            </div>
        </div>

        <!-- 4. EXTRA / PLACEHOLDER -->
        <div class="settings-section">
            <h2 class="section-header">Other</h2>
            <div class="section-content">
                <p class="placeholder-text">More settings coming soon...</p>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block extra_scripts %}
{% endblock %}
