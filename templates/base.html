<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LMS{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}">

    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.7/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.3.7/js/dataTables.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css">
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>

    {% block head %}{% endblock %}
</head>

<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 19V6.2C4 5.08 4 4.52 4.22 4.09C4.41 3.72 4.72 3.41 5.09 3.22C5.52 3 6.08 3 7.2 3H16.8C17.92 3 18.48 3 18.91 3.22C19.28 3.41 19.59 3.72 19.78 4.09C20 4.52 20 5.08 20 6.2V17H6C4.9 17 4 17.9 4 19Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 19C4 20.1 4.9 21 6 21H20M9 7H15M9 11H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="sidebar-logo-text">LMS</span>
    </div>

    <ul class="sidebar-nav">
      <li>
        <a href="/dashboard" class="sidebar-link {% if request.path == '/dashboard' %}active{% endif %}">
          <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 4H10V10H4V4Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 4H20V10H14V4Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 14H10V20H4V14Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 14H20V20H14V14Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="sidebar-label">Dashboard</span>
        </a>
      </li>
      <li>
        <a href="/books" class="sidebar-link {% if request.path == '/books' %}active{% endif %}">
          <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 19V6.2C4 5.0799 4 4.51984 4.21799 4.09202C4.40973 3.71569 4.71569 3.40973 5.09202 3.21799C5.51984 3 6.0799 3 7.2 3H16.8C17.9201 3 18.4802 3 18.908 3.21799C19.2843 3.40973 19.5903 3.71569 19.782 4.09202C20 4.51984 20 5.0799 20 6.2V17H6C4.89543 17 4 17.8954 4 19ZM4 19C4 20.1046 4.89543 21 6 21H20M9 7H15M9 11H15M19 17V21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="sidebar-label">Book management</span>
        </a>
      </li>
      <li>
        <a href="/borrow" class="sidebar-link {% if request.path == '/borrow' %}active{% endif %}">
          <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 19V6.2C5 5.0799 5 4.51984 5.21799 4.09202C5.40973 3.71569 5.71569 3.40973 6.09202 3.21799C6.51984 3 7.0799 3 8.2 3H15.8C16.9201 3 17.4802 3 17.908 3.21799C18.2843 3.40973 18.5903 3.71569 18.782 4.09202C19 4.51984 19 5.0799 19 6.2V17H7C5.89543 17 5 17.8954 5 19ZM5 19C5 20.1046 5.89543 21 7 21H19M18 17V21M15 13.5C14.7164 12.3589 13.481 11.5 12 11.5C10.519 11.5 9.28364 12.3589 9 13.5M12 7.5H12.01M13 7.5C13 8.05228 12.5523 8.5 12 8.5C11.4477 8.5 11 8.05228 11 7.5C11 6.94772 11.4477 6.5 12 6.5C12.5523 6.5 13 6.94772 13 7.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="sidebar-label">Borrow &amp; return</span>
        </a>
      </li>
      <li>
        <a href="/logs" class="sidebar-link {% if request.path == '/logs' %}active{% endif %}">
          <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 8V12L14.5 14.5" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

          </svg>
          <span class="sidebar-label">Audit trail</span>
        </a>
      </li>
    </ul>

    <!-- Settings pinned to bottom -->
    <div class="sidebar-bottom">
      <a href="/settings" class="sidebar-link {% if request.path == '/settings' %}active{% endif %}">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

        </svg>
        <span class="sidebar-label">Settings</span>
      </a>
    </div>
  </aside>

  <!-- Main wrapper -->
  <div class="main-wrapper">

    <!-- Topbar -->
    <header class="topbar">
      <span class="topbar-title">{% block page_title %}{% endblock %}</span>
    </header>

    <!-- Page content -->
    <main class="page-content">
      {% block content %}{% endblock %}
    </main>

  </div>

  <script src="{{ url_for('static', filename='js/settings-theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/settings-font.js') }}"></script>

  {% block extra_scripts %}{% endblock %}

</body>
</html>
